name: CI
on:
  push:
    branches: [ "master", "pre-release" ]
  pull_request:
    branches: [ "master", "pre-release" ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
    
    # Match Dockerfile dependencies
    - name: Install Dependencies
      timeout-minutes: 10
      run: |
        # The hosted runner's Azure HTTP mirror can be slow for large packages.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        fi
        sudo apt-get update -o Acquire::Retries=3 -o Acquire::https::Timeout=30
        sudo apt-get install -y --no-install-recommends \
          espeak-ng \
          espeak-ng-data \
          git \
          libsndfile1 \
          curl \
          ffmpeg \
          g++ \
          cmake
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv pip install -e .[test,cpu]
    - name: Run Tests
      run: |
        uv run pytest api/tests/ --asyncio-mode=auto --cov=api --cov-report=term-missing
